[project]
name = "dataprice"
version = "0.1.0"
description = "ClickHouse + ArcticDB + PostgreSQL data plane for a Python quant stack"
requires-python = ">=3.11"
dependencies = [
    "arcticdb>=5",
    "clickhouse-connect>=0.8",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
dataprice = "dataprice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]
package = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataprice = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
